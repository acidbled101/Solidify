[project]
name = "trellis-apple"
version = "0.1.0"
description = "TRELLIS.2 image-to-3D generation for Apple Silicon"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "torch>=2.1",
    "torchvision",
    "torchaudio",
    "transformers",
    "accelerate",
    "huggingface_hub",
    "safetensors",
    "pillow",
    "numpy",
    "trimesh",
    "scipy",
    "tqdm",
    "fast-simplification",
    "scikit-image",
    "rtree",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.optional-dependencies]
# v2 print-prep pipeline (trellis_core/printable_v2.py + compare_printable.py).
# Not required by the default v1 pipeline, so it stays out of the base install:
#   pip install -e ".[postproc-v2]"
postproc-v2 = [
    "pymeshlab",
    "manifold3d",
    "meshlib",
]

[project.scripts]
trellis-generate = "generate:main"
