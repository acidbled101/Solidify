[project]
name = "trellis-apple"
version = "0.1.0"
description = "TRELLIS.2 image-to-3D generation for Apple Silicon"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "torch>=2.1",
    "torchvision",
    "torchaudio",
    "transformers",
    "accelerate",
    "huggingface_hub",
    "safetensors",
    "pillow",
    "numpy",
    "trimesh",
    "scipy",
    "tqdm",
    "fast-simplification",
    "scikit-image",
    "rtree",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    # The print-prep repair stack (trellis_core/printprep/). These were an
    # optional "postproc-v2" extra back when print-prep defaulted to v1, which
    # does not use them. server/config.py has defaulted to v3 since 2026-07-29,
    # and printable_v2.py imports pymeshlab and manifold3d inside functions --
    # so as an extra they did not fail at install time or at startup, they
    # failed several minutes into a user's first job.
    "pymeshlab",
    "manifold3d",
    "meshlib",
]

[project.scripts]
trellis-generate = "generate:main"
